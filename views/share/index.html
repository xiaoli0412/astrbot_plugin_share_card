<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/><title>卡片分享</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#242a35;--text:#e8ecf3;--muted:#8b95a7;
      --accent:#6ea8fe;--ok:#3fb950;--warn:#d29922}
@media(prefers-color-scheme:light){:root{--bg:#f6f7f9;--panel:#fff;--line:#e3e6ec;
      --text:#1a1d23;--muted:#6b7280;--accent:#2563eb}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:880px;margin:0 auto;padding:20px}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:16px}
h1{font-size:19px;margin:0;font-weight:650}.sub{color:var(--muted);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
.stat .k{color:var(--muted);font-size:11.5px;margin-bottom:3px}
.stat .v{font-size:20px;font-weight:650}.stat .v small{font-size:12px;font-weight:400;color:var(--muted)}
h2{font-size:14px;margin:20px 0 10px;font-weight:620;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 15px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:9px;font-size:13px}
.badge{font-size:11px;padding:1.5px 7px;border-radius:5px;background:rgba(110,168,254,.14);
       color:var(--accent);font-weight:600}.badge.ok{background:rgba(63,185,80,.15);color:var(--ok)}
.badge.warn{background:rgba(210,153,34,.15);color:var(--warn)}
.muted{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:26px 0;font-size:13px}
button{padding:9px 16px;border-radius:9px;border:1px solid var(--line);background:var(--panel);
color:var(--text);cursor:pointer;font-size:13.5px}button:hover{border-color:var(--accent)}
.bar{display:flex;gap:8px;margin-bottom:14px}
.foot{color:var(--muted);font-size:11.5px;text-align:center;margin-top:22px}
</style></head><body><div class="wrap">
<header><h1>卡片分享</h1><span class="sub" id="conn">连接中…</span></header>
<div class="grid" id="stats"></div>
<div class="bar"><button id="refresh">刷新</button><button id="test">手动触发一次</button></div>
<h2>分享记录</h2><div id="records"><div class="empty">还没有分享记录</div></div>
<div class="foot">只有「冷场够久」才会发，不会定时刷屏。</div>
</div><script type="module">
const PLUGIN_ID="astrbot_plugin_share_card";
const bridge=window.AstrBotPluginView||window.AstrBotPluginPage;
const el=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function apiGet(ep){const p=await bridge.apiGet(`${PLUGIN_ID}/${ep}`);if(p&&p.ok===false)throw new Error(p.error);return p&&Object.prototype.hasOwnProperty.call(p,"data")?p.data:p;}
async function apiPost(ep,b){const p=await bridge.apiPost(`${PLUGIN_ID}/${ep}`,b||{});if(p&&p.ok===false)throw new Error(p.error);return p||{};}
function render(d){
  const idle=d.idle_hours<0?"—":d.idle_hours.toFixed(1)+"h";
  const gap=d.share_gap_hours<0?"—":d.share_gap_hours.toFixed(1)+"h";
  el("stats").innerHTML=`
   <div class="stat"><div class="k">总开关</div><div class="v">${d.enabled?"开":"关"}</div></div>
   <div class="stat"><div class="k">主动分享</div><div class="v">${d.proactive_enabled?"开":"关"}</div></div>
   <div class="stat"><div class="k">距上次聊天</div><div class="v">${idle}</div></div>
   <div class="stat"><div class="k">距上次分享</div><div class="v">${gap}</div></div>
   <div class="stat"><div class="k">今日已发</div><div class="v">${d.today_count}<small>/${d.max_per_day}</small></div></div>
   <div class="stat"><div class="k">触发条件</div><div class="v" style="font-size:13px">冷场≥${d.idle_trigger_hours}h</div></div>`;
  const rs=d.records||[];
  el("records").innerHTML=rs.length?rs.map(r=>`
    <div class="card"><div class="row">
      <span class="badge ${r.ok?"ok":"warn"}">${r.ok?"成功":"失败"}</span>
      <span class="muted">${esc(r.ts||"")}</span>
      <span>${esc(r.title||r.bvid||r.via||"")}</span>
      <span class="muted">${esc(r.keyword||"")}</span>
    </div></div>`).join(""):`<div class="empty">还没有分享记录</div>`;
}
async function load(){try{el("conn").textContent="已连接";render(await apiGet("overview"));}catch(e){el("conn").textContent="连接失败";}}
async function boot(){if(!bridge){el("conn").textContent="bridge 未加载";return;}
 await bridge.ready();await load();
 el("refresh").onclick=load;
 el("test").onclick=async()=>{if(!confirm("立即触发一次分享？（会真发到 QQ）"))return;
   try{await apiPost("test_push");alert("已触发，看日志");load();}catch(e){alert("失败："+e.message);}};
 setInterval(load,15000);}
boot();
</script></body></html>
